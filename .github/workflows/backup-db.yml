# Backup diario de las bases de datos (dev y prod) hacia artifacts de GitHub.
#
# - Corre todos los días a las 09:00 UTC (≈ 3–5 am en México) y también
#   manualmente desde la pestaña "Run workflow".
# - Cada dump se comprime (.sql.gz) y sube como artifact con retención de
#   14 días: Actions → Backup BD → run → Artifacts.
# - Las BDs de Railway son serverless: si están dormidas, la primera conexión
#   las despierta pero Railway la corta ("Lost connection ... reading initial
#   communication packet") y el proxy TCP público no la despierta. Por eso
#   primero se llama a /api/dbStarter de la app (consulta por red privada) y
#   se reintenta hasta ~5 min; el dump también se reintenta.
# - Requiere estos secrets del repo (Settings → Secrets and variables → Actions):
#     DB_PROD_HOST, DB_PROD_PORT, DB_PROD_USER, DB_PROD_PASSWORD
#     DB_DEV_HOST,  DB_DEV_PORT,  DB_DEV_USER,  DB_DEV_PASSWORD
name: Backup BD

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # Que falle una base no cancela el backup de la otra.
      fail-fast: false
      matrix:
        include:
          - entorno: prod
            clave: PROD
          - entorno: dev
            clave: DEV
    env:
      DB_HOST: ${{ secrets[format('DB_{0}_HOST', matrix.clave)] }}
      DB_PORT: ${{ secrets[format('DB_{0}_PORT', matrix.clave)] }}
      DB_USER: ${{ secrets[format('DB_{0}_USER', matrix.clave)] }}
      # MYSQL_PWD evita pasar la contraseña por línea de comandos.
      MYSQL_PWD: ${{ secrets[format('DB_{0}_PASSWORD', matrix.clave)] }}
      # App que usa esa BD: su /api/dbStarter hace una consulta desde la red
      # privada de Railway, que es lo que despierta la BD (el proxy TCP
      # público no la despierta). Configurable con las variables del repo
      # APP_PROD_URL / APP_DEV_URL; sin URL se salta el paso HTTP.
      APP_URL: ${{ matrix.clave == 'PROD' && (vars.APP_PROD_URL || 'https://advancedtabletennis.up.railway.app') || vars.APP_DEV_URL }}
    steps:
      - name: Instalar cliente MySQL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client >/dev/null

      - name: Despertar BD (serverless)
        run: |
          if [ -z "$DB_HOST" ] || [ -z "$DB_PORT" ] || [ -z "$DB_USER" ]; then
            echo "::error::Faltan secrets DB_${{ matrix.clave }}_* en el repo"
            exit 1
          fi
          # Hasta 20 intentos cada 15 s (~5 min). En cada uno se llama primero
          # a /api/dbStarter de la app (despierta app + BD por red privada) y
          # luego se prueba SELECT 1 por el proxy público; si responde, seguimos.
          for i in $(seq 1 20); do
            if [ -n "${APP_URL:-}" ]; then
              RESP=$(curl -s --max-time 60 "$APP_URL/api/dbStarter" || true)
              echo "dbStarter: ${RESP:-sin respuesta}"
            fi
            if ERR=$(mysql --ssl-mode=DISABLED --connect-timeout=20 \
                 -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" -e 'SELECT 1' railway 2>&1 >/dev/null); then
              echo "BD despierta (intento $i)"
              exit 0
            fi
            echo "Intento $i: la BD aún no responde ($ERR), reintentando en 15 s…"
            sleep 15
          done
          echo "::error::La BD ${{ matrix.entorno }} no respondió tras ~5 min"
          exit 1

      - name: Volcar base ${{ matrix.entorno }}
        run: |
          set -uo pipefail
          TS=$(date +%Y%m%d_%H%M%S)
          OUT="backup-${{ matrix.entorno }}-${TS}.sql.gz"
          # Reintento por si la BD vuelve a dormirse o la conexión parpadea.
          for i in 1 2 3; do
            if mysqldump --ssl-mode=DISABLED --connect-timeout=20 \
                 --single-transaction --quick --routines --triggers \
                 -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USER" railway | gzip > "$OUT"; then
              # Verificación: gzip íntegro y dump completo.
              gunzip -t "$OUT" && gunzip -c "$OUT" | tail -n 1 | grep -q 'Dump completed' && {
                echo "Tamaño: $(du -h "$OUT" | cut -f1)"
                exit 0
              }
            fi
            echo "Intento $i del dump falló, reintentando en 30 s…"
            rm -f "$OUT"
            sleep 30
          done
          echo "::error::No se pudo volcar la BD ${{ matrix.entorno }}"
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ matrix.entorno }}
          path: backup-${{ matrix.entorno }}-*.sql.gz
          retention-days: 14
